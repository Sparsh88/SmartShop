<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23121212'/%3E%3Ctext x='16' y='21' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-size='17' font-weight='800'%3ES%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartShop | Full-Stack E-commerce</title>
    
    <!-- Meta tags for SEO -->
    <meta name="description" content="Shop the latest trends in electronics, fashion, and home goods at SmartShop. Fast checkout, secure payments, and a premium shopping experience." />
    <meta name="keywords" content="e-commerce, shopping, buy online, electronics, clothing, fast shipping" />
    <meta name="author" content="SmartShop Inc." />
    
    <!-- Premium Fonts: Plus Jakarta Sans (Editorial Display) & Inter (Clean UI) & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Instant Theme Synchronization to prevent theme flashing on startup -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored ? stored : (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF9F6] text-neutral-900 dark:bg-[#0D0D0E] dark:text-neutral-100 font-sans antialiased overflow-x-hidden transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
